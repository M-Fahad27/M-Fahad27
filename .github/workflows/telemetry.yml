name: Refresh GitHub telemetry

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telemetry.yml"
      - "scripts/update_github_telemetry.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate local telemetry SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_github_telemetry.py

      - name: Commit refreshed telemetry
        run: |
          if git diff --quiet -- assets/github-telemetry.svg; then
            echo "Telemetry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-telemetry.svg
          git commit -m "chore: refresh GitHub telemetry [skip ci]"
          git push
