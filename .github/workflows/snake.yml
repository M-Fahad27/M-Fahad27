name: Refresh contribution stream

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Copy generated files into local assets
        run: |
          cp dist/github-contribution-grid-snake.svg assets/github-contribution-grid-snake.svg
          cp dist/github-contribution-grid-snake-dark.svg assets/github-contribution-grid-snake-dark.svg

      - name: Commit refreshed contribution stream
        run: |
          if git diff --quiet -- assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg; then
            echo "Contribution stream is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg
          git commit -m "chore: refresh contribution stream [skip ci]"
          git push
