<svg width="1200" height="510" viewBox="0 0 1200 510" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="510"><stop stop-color="#030712"/><stop offset=".5" stop-color="#071426"/><stop offset="1" stop-color="#13071F"/></linearGradient>
    <linearGradient id="g" x1="55" y1="0" x2="1145" y2="0"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#818CF8"/><stop offset="1" stop-color="#D946EF"/></linearGradient>
    <radialGradient id="orbA"><stop stop-color="#22D3EE" stop-opacity=".2"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop stop-color="#D946EF" stop-opacity=".18"/><stop offset="1" stop-color="#D946EF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#7DD3FC" stroke-opacity=".055"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
    <clipPath id="term"><rect x="42" y="32" width="1116" height="438" rx="22"/></clipPath>
    <mask id="type1"><rect x="84" y="91" width="0" height="26" fill="white"><animate attributeName="width" values="0;520;520" keyTimes="0;.25;1" dur="8s" repeatCount="indefinite"/></rect></mask>
    <mask id="type2"><rect x="84" y="140" width="0" height="42" fill="white"><animate attributeName="width" values="0;0;850;850" keyTimes="0;.2;.48;1" dur="8s" repeatCount="indefinite"/></rect></mask>
  </defs>
  <style>
    .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}
    .dash{stroke-dasharray:11 10;animation:dash 3s linear infinite}.scan{animation:scan 5.2s linear infinite}.blink{animation:blink .82s steps(1,end) infinite}.pulse{animation:pulse 2.2s ease-in-out infinite}.p2{animation-delay:.35s}.p3{animation-delay:.7s}.p4{animation-delay:1.05s}.floatA{animation:floatA 8s ease-in-out infinite}.floatB{animation:floatB 10s ease-in-out infinite}.packet{animation:packet 4s linear infinite}.packet2{animation:packet 4s -2s linear infinite}.rise{animation:rise 8s ease-in-out infinite}.r2{animation-delay:.25s}.r3{animation-delay:.5s}.r4{animation-delay:.75s}
    @keyframes dash{to{stroke-dashoffset:-130}}@keyframes scan{from{transform:translateY(-85px)}to{transform:translateY(520px)}}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(25px,12px)}}@keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,-14px)}}@keyframes packet{from{transform:translateX(0)}to{transform:translateX(720px)}}@keyframes rise{0%,100%{transform:translateY(0);opacity:.74}50%{transform:translateY(-5px);opacity:1}}
  </style>
  <rect width="1200" height="510" rx="26" fill="url(#bg)"/><rect width="1200" height="510" rx="26" fill="url(#grid)"/>
  <g class="floatA" filter="url(#soft)"><circle cx="120" cy="80" r="145" fill="url(#orbA)"/></g><g class="floatB" filter="url(#soft)"><circle cx="1080" cy="440" r="170" fill="url(#orbB)"/></g>
  <rect x="42" y="32" width="1116" height="438" rx="22" fill="#020617" fill-opacity=".82" stroke="url(#g)" stroke-opacity=".62"/>
  <g clip-path="url(#term)">
    <rect x="42" y="32" width="1116" height="42" fill="#0B1220"/><circle cx="67" cy="53" r="6" fill="#FB7185"/><circle cx="89" cy="53" r="6" fill="#FBBF24"/><circle cx="111" cy="53" r="6" fill="#34D399"/>
    <text x="600" y="58" text-anchor="middle" class="mono" font-size="12" fill="#94A3B8">identity.service // production-ai // secure session</text>
    <rect x="43" y="74" width="1114" height="2" fill="url(#g)" opacity=".55" class="pulse"/>
    <rect x="45" y="-80" width="1110" height="65" fill="url(#g)" opacity=".06" class="scan"/>

    <text x="84" y="108" class="mono" font-size="17" fill="#67E8F9" mask="url(#type1)">$ ./identity --boot --mode=production</text>
    <text x="84" y="163" class="sans" font-size="38" font-weight="800" letter-spacing="1.2" fill="url(#g)" filter="url(#glow)" mask="url(#type2)">MUHAMMAD FAHAD // AI ENGINEER</text>
    <rect x="871" y="138" width="10" height="30" rx="1" fill="#22D3EE" class="blink"/>

    <g transform="translate(84 195)">
      <g class="rise"><circle cx="7" cy="7" r="7" fill="#22D3EE" fill-opacity=".18" stroke="#22D3EE"/><circle cx="7" cy="7" r="3" fill="#22D3EE" class="pulse"/><text x="26" y="12" class="mono" font-size="14" fill="#CBD5E1">ROLE</text><text x="118" y="12" class="mono" font-size="14" fill="#67E8F9">AI Engineer · Production systems</text></g>
      <g transform="translate(0 38)" class="rise r2"><circle cx="7" cy="7" r="7" fill="#60A5FA" fill-opacity=".18" stroke="#60A5FA"/><circle cx="7" cy="7" r="3" fill="#60A5FA" class="pulse p2"/><text x="26" y="12" class="mono" font-size="14" fill="#CBD5E1">BASE</text><text x="118" y="12" class="mono" font-size="14" fill="#93C5FD">Islamabad, Pakistan · UTC+5</text></g>
      <g transform="translate(0 76)" class="rise r3"><circle cx="7" cy="7" r="7" fill="#A78BFA" fill-opacity=".18" stroke="#A78BFA"/><circle cx="7" cy="7" r="3" fill="#A78BFA" class="pulse p3"/><text x="26" y="12" class="mono" font-size="14" fill="#CBD5E1">FOCUS</text><text x="118" y="12" class="mono" font-size="14" fill="#C4B5FD">RAG · agents · speech intelligence · automation</text></g>
      <g transform="translate(0 114)" class="rise r4"><circle cx="7" cy="7" r="7" fill="#E879F9" fill-opacity=".18" stroke="#E879F9"/><circle cx="7" cy="7" r="3" fill="#E879F9" class="pulse p4"/><text x="26" y="12" class="mono" font-size="14" fill="#CBD5E1">STATUS</text><text x="118" y="12" class="mono" font-size="14" fill="#F0ABFC">shipping reliable AI beyond the notebook</text></g>
    </g>

    <g transform="translate(674 195)">
      <rect width="424" height="157" rx="16" fill="#071827" fill-opacity=".84" stroke="#818CF8" stroke-opacity=".42"/>
      <text x="22" y="30" class="mono" font-size="12" fill="#94A3B8">PRODUCTION_STACK</text>
      <text x="22" y="60" class="mono" font-size="13" fill="#67E8F9">runtime</text><text x="112" y="60" class="mono" font-size="13" fill="#E2E8F0">Python · FastAPI · Docker · Linux · Nginx</text>
      <text x="22" y="86" class="mono" font-size="13" fill="#93C5FD">ai</text><text x="112" y="86" class="mono" font-size="13" fill="#E2E8F0">LangChain · LangGraph · Groq · Ollama</text>
      <text x="22" y="112" class="mono" font-size="13" fill="#C4B5FD">retrieval</text><text x="112" y="112" class="mono" font-size="13" fill="#E2E8F0">Qdrant · pgvector · BM25 · reranking</text>
      <text x="22" y="138" class="mono" font-size="13" fill="#F0ABFC">delivery</text><text x="112" y="138" class="mono" font-size="13" fill="#E2E8F0">AWS · n8n · APIs · human checkpoints</text>
    </g>

    <path d="M85 381H1110" stroke="url(#g)" stroke-width="2" opacity=".5" class="dash"/>
    <circle cx="112" cy="381" r="5" fill="#22D3EE" filter="url(#glow)" class="packet"/><circle cx="112" cy="381" r="4" fill="#D946EF" filter="url(#glow)" class="packet2"/>
    <text x="84" y="419" class="sans" font-size="17" font-weight="650" fill="#F8FAFC">I build the difficult layer between a convincing AI demo and a dependable production system.</text>
    <text x="84" y="447" class="mono" font-size="13" fill="#94A3B8">retrieval quality · latency · failure recovery · observability · deployment · human-in-the-loop</text>
  </g>
</svg>