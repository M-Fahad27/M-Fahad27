<svg width="1200" height="130" viewBox="0 0 1200 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="130"><stop stop-color="#030712"/><stop offset=".5" stop-color="#071426"/><stop offset="1" stop-color="#13071F"/></linearGradient>
