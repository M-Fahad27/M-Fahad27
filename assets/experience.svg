<svg width="1200" height="425" viewBox="0 0 1200 425" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="425"><stop stop-color="#030712"/><stop offset=".52" stop-color="#071426"/><stop offset="1" stop-color="#13071F"/></linearGradient>
    <linearGradient id="g" x1="70" y1="0" x2="1130" y2="0"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#818CF8"/><stop offset="1" stop-color="#D946EF"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#7DD3FC" stroke-opacity=".05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}.dash{stroke-dasharray:10 12;animation:dash 2.7s linear infinite}.scan{animation:scan 5s linear infinite}.pulse{animation:pulse 2s ease-in-out infinite}.p2{animation-delay:.45s}.p3{animation-delay:.9s}.card{animation:card 4s ease-in-out infinite}.c2{animation-delay:.5s}.c3{animation-delay:1s}.blink{animation:blink .9s steps(1,end) infinite}
    @keyframes dash{to{stroke-dashoffset:-130}}@keyframes scan{from{transform:translateX(-200px)}to{transform:translateX(1300px)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes card{0%,100%{transform:translateY(0);opacity:.82}50%{transform:translateY(-5px);opacity:1}}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
  </style>
  <rect width="1200" height="425" rx="24" fill="url(#bg)"/><rect width="1200" height="425" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="423" rx="23" stroke="url(#g)" stroke-opacity=".34"/>
