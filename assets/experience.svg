    <text x="444" y="207" class="sans" font-size="22" font-weight="750" fill="#F8FAFC">AI Developer</text><text x="444" y="232" class="mono" font-size="14" fill="#A5B4FC">Provoxio Ltd. · Remote</text>
    <text x="444" y="265" class="mono" font-size="13" fill="#CBD5E1">Speak-Align call QA · diarization</text><text x="444" y="288" class="mono" font-size="13" fill="#CBD5E1">compliance scoring · timestamped flags</text><text x="444" y="311" class="mono" font-size="13" fill="#CBD5E1">automated operations reporting</text>
    <text x="444" y="334" class="mono" font-size="11" fill="#64748B">NOV 2025 → PRESENT</text>
